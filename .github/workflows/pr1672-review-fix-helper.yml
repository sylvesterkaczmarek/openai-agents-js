name: PR 1672 async error fix validation

on:
  push:
    branches: [ops/pr1672-review-fixes]

permissions:
  contents: write

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/realtime-function-call-history-645
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch async error patches
        run: |
          git show origin/ops/pr1672-review-fixes:.github/scripts/pr1672_async_error_fix.py > /tmp/pr1672_async_error_fix.py
          git show origin/ops/pr1672-review-fixes:.github/scripts/pr1672_async_error_test_fix.py > /tmp/pr1672_async_error_test_fix.py
          git show origin/ops/pr1672-review-fixes:.github/scripts/pr1672_async_error_type_fix.py > /tmp/pr1672_async_error_type_fix.py
      - name: Apply async error correlation fix
        run: |
          python /tmp/pr1672_async_error_fix.py
          python /tmp/pr1672_async_error_test_fix.py
          python /tmp/pr1672_async_error_type_fix.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: pnpm exec prettier --write packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts
      - name: Run focused Realtime tests
        run: pnpm exec vitest run packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts
      - name: Lint changed TypeScript files
        run: pnpm exec eslint packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts
      - name: Build checks
        run: |
          pnpm -F @openai/agents-core build
          pnpm -F @openai/agents-realtime build-check
          git diff --check
      - name: Push only after validation
        run: |
          git config user.name "Sylvester Kaczmarek"
          git config user.email "16242628+sylvesterkaczmarek@users.noreply.github.com"
          git add packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts
          git diff --cached --check
          git commit -s -m "fix(realtime): correlate replay errors with client events"
          git push origin HEAD:fix/realtime-function-call-history-645
