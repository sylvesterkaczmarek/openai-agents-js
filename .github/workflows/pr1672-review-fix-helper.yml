name: PR 1672 final validation

on:
  push:
    branches: [ops/pr1672-review-fixes]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/realtime-function-call-history-645
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec prettier --check packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts .changeset/green-function-history.md
      - name: Run focused Realtime tests
        run: pnpm exec vitest run packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts
      - name: Lint changed TypeScript files
        run: pnpm exec eslint packages/agents-realtime/src/openaiRealtimeBase.ts packages/agents-realtime/test/functionCallHistoryReplay.test.ts packages/agents-realtime/test/openaiRealtimeBase.test.ts
      - name: Build checks
        run: |
          pnpm -F @openai/agents-core build
          pnpm -F @openai/agents-realtime build-check
          git diff --check b93163b5611b97f2fb40bc7094f45b75cc76c128..HEAD
