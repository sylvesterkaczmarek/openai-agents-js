name: Apply review fixes

on:
  push:
    branches:
      - automation/apply-review-fixes-20260821

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore final newline in reconciliation test
        run: |
          git fetch origin fix/stream-abort-computer-reconciliation
          git checkout -B fix/stream-abort-computer-reconciliation origin/fix/stream-abort-computer-reconciliation
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/agents-core/test/runner/streamReconciliation.test.ts')
          text = path.read_text()
          if not text.endswith('\n'):
              path.write_text(text + '\n')
          PY
          git add packages/agents-core/test/runner/streamReconciliation.test.ts
          git commit -m "style(core): restore reconciliation test newline" || true
          git push origin HEAD:fix/stream-abort-computer-reconciliation
